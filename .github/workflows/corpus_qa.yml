name: Corpus Invariant & Statutory Engine QA Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  corpus-qa:
    name: Lint Corpus Invariants & Database Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Audit Corpus Invariants (6 Invariant Quality Gate)
        run: |
          python3 engine/lint_corpus.py

      - name: Verify Corpus & Database QA Test Suite
        run: |
          python3 -m unittest tests/test_corpus_qa.py
